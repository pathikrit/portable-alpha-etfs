<!doctype html>
<html lang="en" data-astryx-theme="neutral">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portable Alpha ETFs</title>
  <meta name="description" content="A list of US-listed portable alpha (return stacked) ETFs and a tool that shows the exposure of a portfolio made from them.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.16/src/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.16/dist/astryx.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/theme-neutral@0.7.16/dist/theme.css">
  <link rel="stylesheet" href="https://kit.fontawesome.com/a22be8527e.css" crossorigin="anonymous">
  <script>
    // Apply a saved theme before first paint. With no saved theme, the OS setting decides.
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.0",
        "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
        "react-dom": "https://esm.sh/react-dom@19.2.0",
        "react-dom/client": "https://esm.sh/react-dom@19.2.0/client",
        "@astryxdesign/core": "https://esm.sh/@astryxdesign/core@0.7.16?external=react,react-dom",
        "htm": "https://esm.sh/htm@3.1.1"
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      font-family: var(--font-family-body);
      background: var(--color-background-body);
      color: var(--color-text-primary);
    }
    #root { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    .boot { padding: 48px 0; text-align: center; color: var(--color-text-secondary); }
    .brand-icon { font-size: 28px; color: var(--color-icon-accent); }
    .closed, .closed a { text-decoration: line-through; color: var(--color-text-secondary); }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .plus { color: var(--color-text-secondary); font-size: 12px; }
    .holding { display: grid; grid-template-columns: minmax(0, 1fr) 120px auto; gap: 8px; align-items: center; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
    .tile {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-container, 8px);
      padding: 10px 12px;
      border-top: 3px solid var(--tile-color);
      background: var(--color-background-surface);
    }
    .tile-pct { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .bar { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; }
    .bar > span { background: var(--tile-color); min-width: 2px; }
    .num { font-variant-numeric: tabular-nums; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .toolbar > :first-child { flex: 1 1 260px; max-width: 420px; }
    .group-head { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; }
    @media (max-width: 560px) { .holding { grid-template-columns: minmax(0, 1fr) 96px auto; } }
  </style>
</head>
<body>
  <div id="root"><div class="boot">Loading the ETF list…</div></div>

  <!-- Pure logic. No DOM access here: tests/ loads this block and runs it in Node. -->
  <script id="logic">
    const PA = (() => {
      const CATEGORIES = [
        'Classic combos (equities/bonds/gold), more than 1.75x stacking',
        'Classic combos, 1.75x stacking or less',
        'Managed futures (includes CTAs and carry)',
        'Crypto related',
      ];

      // Known values of allocation[].what: [hover text, color]. A value that is not here shows as-is, in gray.
      const WHAT = {
        MF: ['Managed futures', 'purple'],
        CTA: ['Managed futures (CTA trend following)', 'purple'],
        Carry: ['Futures yield (carry)', 'purple'],
        DBMF: ['iMGP DBi Managed Futures Strategy ETF', 'purple'],
        AHLT: ['American Beacon AHL Trend ETF', 'purple'],
        LCSIX: ['LoCorr Macro Strategies Fund', 'purple'],
        Macro: ['Global macro', 'purple'],
        MNA: ['Merger arbitrage', 'pink'],
        'L/S': ['Long/short US equity', 'pink'],
        'Intl L/S': ['Long/short international equity', 'pink'],
        BTC: ['Bitcoin', 'orange'],
        ETH: ['Ether', 'orange'],
        Gold: ['Gold', 'yellow'],
        Silver: ['Silver', 'yellow'],
        Copper: ['Copper', 'yellow'],
        Oil: ['Crude oil', 'yellow'],
        Commodities: ['Commodities', 'yellow'],
        DBC: ['Broad commodities', 'yellow'],
        SPY: ['S&P 500', 'blue'],
        QQQ: ['Nasdaq-100', 'blue'],
        VT: ['Global equities', 'blue'],
        VXUS: ['International equities (ex-US)', 'blue'],
        VEA: ['Developed markets equities (ex-US)', 'blue'],
        EFA: ['Developed markets equities (ex-US)', 'blue'],
        VWO: ['Emerging markets equities', 'blue'],
        VGK: ['European equities', 'blue'],
        EWJ: ['Japanese equities', 'blue'],
        IJR: ['US small-cap equities', 'blue'],
        'US Small Cap': ['US small-cap equities', 'blue'],
        'US Equity': ['US equity ETFs', 'blue'],
        'Intl Equity': ['International equity ETFs', 'blue'],
        Stocks: ['Individual stocks', 'blue'],
        Sector: ['Tactical sector position', 'blue'],
        'Equity Rotation': ['Tactical equity rotation', 'blue'],
        'Gold Miners': ['Gold miners', 'blue'],
        'Copper Miners': ['Copper miners', 'blue'],
        REMX: ['Rare earth and strategic metals miners', 'blue'],
        CRIT: ['Critical materials miners', 'blue'],
        Bonds: ['Bonds', 'teal'],
        'Corp Bonds': ['Investment-grade corporate bonds', 'teal'],
        Munis: ['Municipal bonds', 'teal'],
        GOVT: ['US Treasuries', 'teal'],
        BND: ['US aggregate bonds', 'teal'],
        AGG: ['US aggregate bonds', 'teal'],
        IEF: ['7-10 year US Treasuries', 'teal'],
        IEI: ['3-7 year US Treasuries', 'teal'],
        MINT: ['Short-duration active bonds', 'teal'],
        BIL: ['Treasury bills', 'teal'],
        STIP: ['Short-term TIPS', 'teal'],
        TIPZ: ['Inflation-linked bonds (TIPS)', 'teal'],
        LTPZ: ['Long-term TIPS', 'teal'],
      };
      const CRYPTO = new Set(['BTC', 'ETH']);
      const isManagedFutures = (what) => (WHAT[what] || [])[1] === 'purple' && what !== 'Macro';

      const hoverText = (what) => (WHAT[what] || [what])[0];
      const colorOf = (what) => (WHAT[what] || [what, 'gray'])[1];

      const totalPct = (etf) => etf.allocation.reduce((sum, a) => sum + a.pct, 0);
      const leverage = (etf) => totalPct(etf) / 100;

      // The category is not stored in etf.json. It comes from the allocation.
      function categoryOf(etf) {
        const whats = etf.allocation.map((a) => a.what);
        if (whats.some((w) => CRYPTO.has(w))) return CATEGORIES[3];
        if (whats.some(isManagedFutures)) return CATEGORIES[2];
        return leverage(etf) > 1.75 ? CATEGORIES[0] : CATEGORIES[1];
      }

      const formatPct = (n) => `${Math.round(n * 10) / 10}%`;
      const allocationText = (etf) => etf.allocation.map((a) => `${formatPct(a.pct)} ${a.what}`).join(' + ');

      // Free-form search: each word must be in at least one field.
      function matches(etf, query) {
        const status = etf.closed ? 'closed' : etf.upcoming ? 'upcoming' : 'trading';
        const haystack = [
          etf.ticker, etf.name, allocationText(etf), categoryOf(etf), status,
          ...etf.allocation.map((a) => hoverText(a.what)),
        ].join(' ').toLowerCase();
        return query.toLowerCase().split(/\s+/).filter(Boolean).every((word) => haystack.includes(word));
      }

      // holdings: [{ticker, weight}], weight in percent of the portfolio.
      // A ticker that is not in etfs counts as 100% itself.
      function exposures(holdings, etfs) {
        const byTicker = new Map(etfs.filter((e) => e.ticker).map((e) => [e.ticker.toUpperCase(), e]));
        const sums = new Map();
        const add = (what, pct) => sums.set(what, (sums.get(what) || 0) + pct);
        let weight = 0;
        for (const h of holdings) {
          const ticker = (h.ticker || '').trim().toUpperCase();
          const w = Number(h.weight) || 0;
          if (!ticker || w <= 0) continue;
          weight += w;
          const etf = byTicker.get(ticker);
          if (etf) for (const a of etf.allocation) add(a.what, (w * a.pct) / 100);
          else add(ticker, w);
        }
        const total = [...sums.values()].reduce((a, b) => a + b, 0);
        const rows = [...sums].map(([what, pct]) => ({ what, pct, normalized: total ? (pct / total) * 100 : 0 }))
          .sort((a, b) => b.pct - a.pct);
        return { rows, total, weight, leverage: weight ? total / weight : 0 };
      }

      const DEFAULT_PORTFOLIO = [
        { ticker: 'RSSX', weight: 40 },
        { ticker: 'RSBT', weight: 30 },
        { ticker: 'AVUV', weight: 30 },
      ];
      // Portfolio in the URL: #p=RSSX:40,RSBT:30,AVUV:30
      const encodePortfolio = (holdings) =>
        holdings.filter((h) => h.ticker).map((h) => `${h.ticker}:${Number(h.weight) || 0}`).join(',');
      function decodePortfolio(text) {
        const holdings = (text || '').split(',').map((part) => {
          const [ticker, weight] = part.split(':');
          return { ticker: (ticker || '').trim().toUpperCase().replace(/[^A-Z0-9.\-]/g, ''), weight: Number(weight) || 0 };
        }).filter((h) => h.ticker);
        return holdings.length ? holdings : null;
      }

      return {
        CATEGORIES, WHAT, hoverText, colorOf, leverage, categoryOf, formatPct, allocationText, matches,
        exposures, DEFAULT_PORTFOLIO, encodePortfolio, decodePortfolio,
      };
    })();
  </script>

  <script type="module">
    import * as React from 'react';
    import { createRoot } from 'react-dom/client';
    import htm from 'htm';
    import {
      Badge, Button, Card, Heading, HStack, IconButton, Link, NumberInput, Switch, Table, Text, TextInput,
      Tooltip, Typeahead, VStack, useTableGroupedRows, useTableSortable, useTableSortableState,
    } from '@astryxdesign/core';

    const { useEffect, useMemo, useState } = React;
    const html = htm.bind(React.createElement);
    const REPO = 'https://github.com/pathikrit/portable-alpha-etfs';

    const Fa = ({ name, className = '' }) =>
      html`<i className=${`fa-duotone fa-solid fa-${name} ${className}`} aria-hidden="true"></i>`;
    const SearchIcon = () => html`<${Fa} name="magnifying-glass" />`;
    const cssColor = (what) => `var(--color-icon-${PA.colorOf(what)})`;

    function Chip({ pct, what }) {
      const label = pct == null ? what : `${PA.formatPct(pct)} ${what}`;
      const badge = html`<${Badge} label=${label} variant=${PA.colorOf(what) === 'gray' ? 'neutral' : PA.colorOf(what)} />`;
      const hover = PA.hoverText(what);
      return hover === what ? badge : html`<${Tooltip} content=${hover}><span>${badge}</span><//>`;
    }

    function ThemeButton() {
      const [dark, setDark] = useState(() => {
        const saved = document.documentElement.dataset.theme;
        return saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      });
      const toggle = () => {
        const next = dark ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch {}
        setDark(!dark);
      };
      return html`<${IconButton} variant="ghost" label=${dark ? 'Use light mode' : 'Use dark mode'}
        tooltip=${dark ? 'Use light mode' : 'Use dark mode'} icon=${html`<${Fa} name=${dark ? 'sun-bright' : 'moon-stars'} />`}
        onClick=${toggle} />`;
    }

    let nextId = 1;
    const withIds = (holdings) => holdings.map((h) => ({ ...h, id: nextId++ }));

    function Portfolio({ etfs, holdings, setHoldings }) {
      const items = useMemo(
        () => etfs.filter((e) => e.ticker).map((e) => ({ id: e.ticker, label: e.ticker, name: e.name })),
        [etfs],
      );
      const source = useMemo(() => ({
        bootstrap: () => items,
        search: (query) => {
          const q = query.trim().toUpperCase();
          if (!q) return items;
          const hits = items.filter((i) => i.id.includes(q) || i.name.toUpperCase().includes(q));
          // A ticker that is not in the list is permitted. It counts as 100% itself.
          return hits.some((i) => i.id === q) ? hits : [...hits, { id: q, label: q, name: 'Use this ticker (not a portable alpha ETF)' }];
        },
      }), [items]);
      const update = (id, patch) => setHoldings(holdings.map((h) => (h.id === id ? { ...h, ...patch } : h)));
      const result = PA.exposures(holdings, etfs);
      const weightOk = Math.abs(result.weight - 100) < 0.05;

      return html`
        <${Card} padding=${5}>
          <${VStack} gap=${4}>
            <${HStack} hAlign="between" vAlign="center" wrap="wrap" gap=${2}>
              <${Heading} level=${2}><${Fa} name="chart-pie" /> Portfolio builder<//>
              <${HStack} gap=${2}>
                <${Button} size="sm" variant="ghost" label="Reset" icon=${html`<${Fa} name="rotate-left" />`}
                  onClick=${() => setHoldings(withIds(PA.DEFAULT_PORTFOLIO))} />
                <${Button} size="sm" label="Add a holding" icon=${html`<${Fa} name="plus" />`}
                  onClick=${() => setHoldings([...holdings, { id: nextId++, ticker: '', weight: 0 }])} />
              <//>
            <//>
            <${VStack} gap=${2}>
              ${holdings.map((h) => html`
                <div className="holding" key=${h.id}>
                  <${Typeahead} label="Ticker" isLabelHidden size="sm" placeholder="Ticker, for example RSST or AVUV"
                    searchSource=${source} hasEntriesOnFocus hasClear
                    value=${h.ticker ? { id: h.ticker, label: h.ticker, name: '' } : null}
                    onChange=${(item) => update(h.id, { ticker: item ? item.id : '' })}
                    renderItem=${(item) => html`<span><strong>${item.label}</strong> <${Text} color="secondary" type="supporting">${item.name}<//></span>`} />
                  <${NumberInput} label="Weight" isLabelHidden size="sm" units="%" min=${0} max=${1000} step=${5}
                    value=${h.weight} onChange=${(weight) => update(h.id, { weight })} />
                  <${IconButton} size="sm" variant="ghost" label=${`Remove ${h.ticker || 'holding'}`}
                    icon=${html`<${Fa} name="trash-can" />`} onClick=${() => setHoldings(holdings.filter((x) => x.id !== h.id))} />
                </div>`)}
            <//>
            <${HStack} gap=${3} wrap="wrap" vAlign="center">
              <${Text} type="label">Exposure: <span className="num">${PA.formatPct(result.total)}</span><//>
              <${Badge} variant="info" label=${`${result.leverage.toFixed(2)}x leverage`} />
              ${!weightOk && html`<${Badge} variant="warning"
                label=${`Weights add to ${PA.formatPct(result.weight)}, not 100%`} />`}
            <//>
            ${result.rows.length > 0 && html`
              <div className="bar" role="img" aria-label="Normalized exposure">
                ${result.rows.map((r) => html`<span key=${r.what} title=${`${r.what}: ${PA.formatPct(r.normalized)}`}
                  style=${{ flex: r.normalized, '--tile-color': cssColor(r.what) }}></span>`)}
              </div>
              <div className="tiles">
                ${result.rows.map((r) => html`
                  <div className="tile" key=${r.what} style=${{ '--tile-color': cssColor(r.what) }}>
                    <${Chip} what=${r.what} />
                    <div className="tile-pct">${PA.formatPct(r.pct)}</div>
                    <${Text} type="supporting" color="secondary"><span className="num">${PA.formatPct(r.normalized)}</span> normalized<//>
                  </div>`)}
              </div>`}
            <${Text} type="supporting" color="secondary">
              Exposure is the weight of each holding multiplied by its allocation. Normalized is the exposure divided by the
              total exposure, so that the parts add to 100%. The address of this page keeps your portfolio, so you can share it.
            <//>
          <//>
        <//>`;
    }

    function EtfTable({ etfs, onAdd }) {
      const [query, setQuery] = useState('');
      const [showClosed, setShowClosed] = useState(false);
      const [collapsed, setCollapsed] = useState(() => new Set());

      const rows = useMemo(() => etfs
        .filter((e) => (showClosed || !e.closed) && PA.matches(e, query))
        .map((e) => ({ ...e, key: e.ticker || e.name, leverage: PA.leverage(e), category: PA.categoryOf(e) })),
        [etfs, query, showClosed]);

      const { sortedData, sortConfig } = useTableSortableState({
        data: rows,
        defaultSort: [{ sortKey: 'ticker', direction: 'ascending' }],
        comparators: {
          // Funds that have no ticker yet go last.
          ticker: (a, b) => !a.ticker - !b.ticker || (a.ticker || a.name).localeCompare(b.ticker || b.name),
          name: (a, b) => a.name.localeCompare(b.name),
          leverage: (a, b) => a.leverage - b.leverage,
        },
      });
      const sortPlugin = useTableSortable(sortConfig);
      const grouped = useTableGroupedRows({
        data: sortedData,
        groupBy: (row) => row.category,
        groupOrder: PA.CATEGORIES,
        getRowKey: (row) => row.key,
        collapsedGroups: collapsed,
        onToggleGroup: (group) => setCollapsed((old) => {
          const next = new Set(old);
          next.has(group) ? next.delete(group) : next.add(group);
          return next;
        }),
        renderGroupHeader: (group, count) => html`<span className="group-head">${group} <${Badge} label=${String(count)} /></span>`,
      });

      const columns = useMemo(() => [
        {
          key: 'ticker', header: 'Ticker', sortable: true, width: { type: 'pixel', value: 170 },
          renderCell: (e) => html`
            <span className="chips">
              <span className=${e.closed ? 'closed' : ''}>
                <${Link} href=${e.filing} target="_blank" rel="noopener" weight="semibold" tooltip="SEC filing">${e.ticker || 'No ticker'}<//>
              </span>
              ${e.upcoming && html`<${Badge} variant="info" label="Upcoming" />`}
              ${e.closed && html`<${Badge} variant="error" label="Closed" />`}
            </span>`,
        },
        {
          key: 'name', header: 'Name', sortable: true, width: { type: 'proportional', value: 3, minWidth: 220 },
          renderCell: (e) => html`
            <span className=${e.closed ? 'closed' : ''}>
              <${Link} href=${e.url} target="_blank" rel="noopener" color="primary" hasUnderline
                tooltip=${e.closed ? 'Closure notice' : 'Fund page'}>${e.name}<//>
            </span>`,
        },
        {
          key: 'allocation', header: 'Allocation', width: { type: 'proportional', value: 4, minWidth: 260 },
          renderCell: (e) => html`
            <span className="chips">
              ${e.allocation.map((a, i) => html`<${React.Fragment} key=${a.what}>
                ${i > 0 && html`<span className="plus">+</span>`}<${Chip} pct=${a.pct} what=${a.what} />
              <//>`)}
            </span>`,
        },
        {
          key: 'leverage', header: 'Stack', sortable: true, align: 'end', width: { type: 'pixel', value: 90 },
          renderCell: (e) => html`<span className="num">${e.leverage.toFixed(2)}x</span>`,
        },
        {
          key: 'add', header: '', align: 'end', width: { type: 'pixel', value: 56 },
          renderCell: (e) => e.ticker && html`<${IconButton} size="sm" variant="ghost" label=${`Add ${e.ticker} to the portfolio`}
            tooltip="Add to the portfolio" icon=${html`<${Fa} name="circle-plus" />`} onClick=${() => onAdd(e.ticker)} />`,
        },
      ], [onAdd]);

      return html`
        <${Card} padding=${5}>
          <${VStack} gap=${4}>
            <${Heading} level=${2}><${Fa} name="layer-group" /> The list<//>
            <div className="toolbar">
              <${TextInput} type="search" label="Search" isLabelHidden hasClear startIcon=${SearchIcon}
                placeholder="Search: a ticker, a name, gold, managed futures, upcoming…" value=${query} onChange=${setQuery} />
              <${Switch} label="Show closed funds" value=${showClosed} onChange=${setShowClosed} />
            </div>
            <${Table} data=${grouped.data} idKey=${grouped.idKey} columns=${columns} density="compact" hasHover
              plugins=${{ sort: sortPlugin, group: grouped.plugin }} />
            <${Text} type="supporting" color="secondary">
              ${rows.length} of ${etfs.length} funds shown. The ticker opens the SEC filing. The name opens the fund page
              (for a closed fund, the closure notice). Stack is the sum of the allocation.
            <//>
          <//>
        <//>`;
    }

    function App({ etfs }) {
      const [holdings, setHoldings] = useState(() =>
        withIds(PA.decodePortfolio(new URLSearchParams(location.hash.slice(1)).get('p')) || PA.DEFAULT_PORTFOLIO));
      useEffect(() => {
        history.replaceState(null, '', `#p=${PA.encodePortfolio(holdings)}`);
      }, [holdings]);
      const onAdd = React.useCallback((ticker) => {
        setHoldings((old) => (old.some((h) => h.ticker === ticker) ? old : [...old, { id: nextId++, ticker, weight: 0 }]));
        scrollTo({ top: 0, behavior: 'smooth' });
      }, []);

      return html`
        <${VStack} gap=${5}>
          <${HStack} hAlign="between" vAlign="center" gap=${3}>
            <${HStack} gap=${3} vAlign="center">
              <${Fa} name="layer-plus" className="brand-icon" />
              <${VStack} gap=${0}>
                <${Heading} level=${1}>Portable Alpha ETFs<//>
                <${Text} color="secondary">ETFs listed in the United States only. No mutual funds, no foreign funds, no UCITS.<//>
              <//>
            <//>
            <${HStack} gap=${1}>
              <${IconButton} variant="ghost" label="GitHub repository" tooltip="Add or correct a fund on GitHub"
                icon=${html`<${Fa} name="code-pull-request" />`} href=${REPO} target="_blank" rel="noopener" />
              <${ThemeButton} />
            <//>
          <//>
          <${Portfolio} etfs=${etfs} holdings=${holdings} setHoldings=${setHoldings} />
          <${EtfTable} etfs=${etfs} onAdd=${onAdd} />
          <${Text} type="supporting" color="secondary" justify="center">
            Allocations are approximate targets from fund documents. This page is not investment advice.
            To add or correct a fund, <${Link} href=${`${REPO}/edit/main/etf.json`} target="_blank" rel="noopener">open a pull request for etf.json<//>.
          <//>
        <//>`;
    }

    const root = createRoot(document.getElementById('root'));
    try {
      const response = await fetch('etf.json');
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      root.render(html`<${App} etfs=${await response.json()} />`);
    } catch (error) {
      root.render(html`<div className="boot">Could not load etf.json (${String(error.message)}).</div>`);
    }
  </script>
</body>
</html>
